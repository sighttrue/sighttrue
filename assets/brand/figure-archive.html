<!doctype html><html lang="en"><head><meta charset="utf-8">
<style>
  @font-face { font-family: 'Plex Condensed'; font-weight: 600;
    src: url('../../dist/fonts/ibm-plex-sans-condensed-latin-600-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Plex Mono'; font-weight: 400;
    src: url('../../dist/fonts/ibm-plex-mono-latin-400-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Plex Serif'; font-weight: 400;
    src: url('../../dist/fonts/ibm-plex-serif-latin-400-normal.woff2') format('woff2'); }

  /* text-transform is reset explicitly. The footer uppercases everything in it
     and swallowed the wordmark whole — a lowercase mark set in capitals is a
     different mark, and the crossbar rule then lands nowhere near a crossbar. */
  .wm { font-family: 'Plex Condensed', sans-serif; font-weight: 600;
        letter-spacing: -0.022em; line-height: 1; white-space: nowrap;
        display: inline-block; text-transform: none; }
  .wm-tt { position: relative; }
  /* Absolute, because it must not add width to the word. See the note above on
     why this is 0.56em and not the 0.325em it was. */
  .wm-tt i { position: absolute; left: -0.10em; right: -0.16em;
             top: 0.56em; display: block; }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1600px; height: 900px; background: #121212; color: #e8e8e8;
         font-family: 'Plex Mono', monospace; overflow: hidden;
         display: grid; grid-template-rows: auto 1fr auto; padding: 58px 70px 54px; }

  header { display: flex; justify-content: space-between; align-items: baseline;
           border-bottom: 1px solid #2c2c2c; padding-bottom: 22px; }
  header .kind { font-family: 'Plex Condensed', sans-serif; font-weight: 600; font-size: 22px;
                 letter-spacing: 0.2em; text-transform: uppercase; color: #9e9e9e; }

  main { display: grid; align-content: center; }

  footer { display: flex; justify-content: space-between; align-items: baseline;
           border-top: 1px solid #2c2c2c; padding-top: 22px;
           font-family: 'Plex Mono', monospace; font-size: 21px; color: #6b6b6b; }

  .say { font-family: 'Plex Serif', Georgia, serif; font-size: 30px; line-height: 1.45;
         color: #9e9e9e; max-width: 58ch; }
</style></head>
<body>
  <header><span class="wm" style="font-size:32px;color:#e8e8e8">
    <span>sigh</span><span class="wm-tt">tt<i style="background:#f2857c;height:1.7px"></i></span><span>rue</span>
  </span><span class="kind">Provider incident archive</span></header>
  <main><div class="grid">
  <div>
    <span class="fig">619</span>
    <span class="unit">outages kept</span>
    <p class="say">Across 22 providers and 720 days,
    after the status pages that announced them had moved on.</p>
  </div>
  <div class="chart">
    <div class="bars"><div class="bar" style="height:100%" title="OpenAI"></div><div class="bar" style="height:58%" title="Twilio"></div><div class="bar" style="height:56%" title="Anthropic"></div><div class="bar" style="height:56%" title="Cloudflare"></div><div class="bar" style="height:56%" title="Fly.io"></div><div class="bar" style="height:56%" title="GitHub"></div><div class="bar" style="height:56%" title="Supabase"></div><div class="bar" style="height:38%" title="DigitalOcean"></div><div class="bar" style="height:38%" title="Vercel"></div><div class="bar" style="height:31%" title="Sentry"></div><div class="bar" style="height:25%" title="Render"></div><div class="bar" style="height:22%" title="Stripe"></div><div class="bar" style="height:21%" title="Datadog"></div><div class="bar" style="height:21%" title="MongoDB"></div><div class="bar" style="height:20%" title="Netlify"></div><div class="bar" style="height:12%" title="Upstash"></div><div class="bar" style="height:11%" title="Discord"></div><div class="bar" style="height:6%" title="Heroku"></div><div class="bar" style="height:4%" title="npm"></div><div class="bar" style="height:3%" title="Google Cloud"></div><div class="bar" style="height:3%" title="Groq"></div></div>
    <span class="axis">One mark per provider with an incident on record &mdash; 21
    of the 22 watched, by how many of its incidents this holds</span>
  </div>
</div>
<style>
  .grid { display: grid; grid-template-columns: 1fr 720px; gap: 70px; align-items: center; }
  .fig { font-family: 'Plex Condensed', sans-serif; font-weight: 600; font-size: 200px;
         line-height: 0.84; letter-spacing: -0.028em; color: #d2e2f4; display: block;
         font-variant-numeric: tabular-nums; }
  .unit { font-family: 'Plex Condensed', sans-serif; font-weight: 600; font-size: 40px;
          display: block; margin: 10px 0 24px; }
  .bars { display: flex; align-items: flex-end; gap: 6px; height: 340px;
          border-bottom: 1px solid #3b3b3b; }
  .bar { flex: 1; background: #d2e2f4; min-height: 3px; }
  .axis { font-family: 'Plex Condensed', sans-serif; font-weight: 600; font-size: 19px;
          letter-spacing: 0.16em; text-transform: uppercase; color: #6b6b6b;
          display: block; margin-top: 18px; }
</style></main>
  <footer><span>sighttrue.com</span><span>@Sighttruehq</span></footer>
</body></html>
